<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input
            type="text"
            id="display"
            placeholder="0"
            readonly
        >

        <!-- Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button onclick="clearDisplay()" class="clear">
                C
            </button>

            <button onclick="deleteLast()">
                DEL
            </button>

            <button onclick="addToDisplay('/')">
                ÷
            </button>

            <button onclick="addToDisplay('*')">
                x
            </button>


            <!-- Second Row -->
            <button onclick="addToDisplay('7')">
                7
            </button>

            <button onclick="addToDisplay('8')">
                8
            </button>

            <button onclick="addToDisplay('9')">
                9
            </button>

            <button onclick="addToDisplay('-')">
                -
            </button>


            <!-- Third Row -->
            <button onclick="addToDisplay('4')">
                4
            </button>

            <button onclick="addToDisplay('5')">
                5
            </button>

            <button onclick="addToDisplay('6')">
                6
            </button>

            <button onclick="addToDisplay('+')">
                +
            </button>


            <!-- Fourth Row -->
            <button onclick="addToDisplay('1')">
                1
            </button>

            <button onclick="addToDisplay('2')">
                2
            </button>

            <button onclick="addToDisplay('3')">
                3
            </button>

            <button
                onclick="calculate()"
                class="equal"
            >
                =
            </button>


            <!-- Fifth Row -->
            <button
                onclick="addToDisplay('0')"
                class="zero"
            >
                0
            </button>

            <button onclick="addToDisplay('.')">
                .
            </button>

        </div>

        <!-- Keyboard Hint -->
        <p class="keyboard-info">
            You can also use your keyboard
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
